<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dad Joke Generator</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">✦ DAD JOKE ✦</p>
      <div class="joke-text">
        <p class="setup"></p>
        <p class="punchline" id="punchline"></p>
      </div>
      <div class="actions">
        <button class="button button-teal" id="new-joke-button">New Joke</button>
        <button class="button button-pink" id="reveal-button">Show Punchline</button>
      </div>
    </main>
  </body>
</html>
